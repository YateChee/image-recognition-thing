
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hand Signal Recognition</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f7fb;
            color: #1f2937;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            text-align: center;
            width: min(90vw, 640px);
        }

        button {
            margin: 12px 0 16px;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        video {
            width: 100%;
            max-width: 480px;
            border-radius: 10px;
            background: #111827;
        }

        #status {
            margin-top: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hand Signal Recognition</h1>
        <p>Allow camera access when the browser asks.</p>
        <button id="startButton">Start webcam</button>
        <video id="video" autoplay playsinline muted></video>
        <p id="status">Waiting for camera...</p>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
